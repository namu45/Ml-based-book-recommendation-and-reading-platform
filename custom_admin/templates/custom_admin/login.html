<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BookWise Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0f14;
      --surface: #13161e;
      --surface-2: #1a1e2a;
      --border: #252a38;
      --text-1: #eae8e0;
      --text-2: #9a9896;
      --gold: #c9a84c;
      --gold-dim: rgba(201,168,76,.12);
      --radius: 12px;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-1);
    }

    .login-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 360px;
      padding: 32px 28px;
      box-shadow: 0 4px 24px rgba(0,0,0,.45);
      text-align: center;
      animation: fadeUp 0.3s ease both;
    }

    .login-panel h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .login-panel .error-msg {
      color: #c96060;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .login-panel input[type="text"],
    .login-panel input[type="password"] {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-1);
      font-size: 14px;
      margin-bottom: 16px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .login-panel input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-dim);
      outline: none;
    }

    .login-panel button {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      color: #1a1100;
      background: var(--gold);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all .18s ease;
      box-shadow: 0 2px 12px var(--gold-dim);
    }
    .login-panel button:hover {
      opacity: .9;
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(201,168,76,.35);
    }

    .login-footer {
      margin-top: 18px;
      font-size: 12px;
      color: var(--text-2);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-panel">
    <h2>BookWise Admin Login</h2>
    {% if error %}
      <div class="error-msg">{{ error }}</div>
    {% endif %}
    <form method="POST">
      {% csrf_token %}
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    {% comment %} <div class="login-footer">
        <!-- Inside .login-panel, below the form -->

      &copy; 2026 BookWise Admin
    </div> {% endcomment %}
  </div>
</body>
</html>
